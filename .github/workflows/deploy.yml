name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Delete package-lock.json to avoid the npm optional-deps bug
        # (package-lock was generated on darwin-arm64, so the Linux rollup
        # native addon @rollup/rollup-linux-x64-gnu is missing from it).
        # https://github.com/npm/cli/issues/4828
        run: |
          rm -f package-lock.json
          npm install

      - name: Build contract + frontend
        env:
          VITE_CONTRACT_ADDRESS: ${{ secrets.VITE_CONTRACT_ADDRESS }}
          VITE_SPONSOR_URL: ${{ secrets.VITE_SPONSOR_URL }}
        run: npm run build-production

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          WALLET_SEED: ${{ secrets.WALLET_SEED }}
          SHADOWCIPHER_CONTRACT_ADDRESS: ${{ secrets.SHADOWCIPHER_CONTRACT_ADDRESS }}
          MIDNIGHT_NETWORK: ${{ secrets.MIDNIGHT_NETWORK }}
          PROOF_SERVER_URL: ${{ secrets.PROOF_SERVER_URL }}
          POOL_TARGET_SIZE: ${{ secrets.POOL_TARGET_SIZE }}
          PORT: 3003
        run: |
          set -euo pipefail
          echo "$EC2_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ec2-user@${EC2_HOST}"
          SCP="scp -i /tmp/deploy_key -o StrictHostKeyChecking=no"
          RSYNC_SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no"

          $SSH 'mkdir -p /opt/shadow-cipher/{server,shadowcipher-contract/src/managed,dist}'

          # Fresh .env on the box
          printf '%s\n' \
            "PORT=${PORT}" \
            "WALLET_SEED=${WALLET_SEED}" \
            "SHADOWCIPHER_CONTRACT_ADDRESS=${SHADOWCIPHER_CONTRACT_ADDRESS}" \
            "MIDNIGHT_NETWORK=${MIDNIGHT_NETWORK:-preprod}" \
            "PROOF_SERVER_URL=${PROOF_SERVER_URL:-http://localhost:6300}" \
            "SQLITE_PATH=/opt/shadow-cipher/data.db" \
            "POOL_TARGET_SIZE=${POOL_TARGET_SIZE:-20}" \
            > /tmp/shadow-cipher.env
          $SCP /tmp/shadow-cipher.env "ec2-user@${EC2_HOST}:/opt/shadow-cipher/.env"

          # Frontend build (static)
          rsync -az --delete -e "$RSYNC_SSH" \
            frontend-vite-react/dist/ "ec2-user@${EC2_HOST}:/opt/shadow-cipher/dist/"

          # Server source (ts, no compile — ts-node/esm runs it)
          rsync -az --delete -e "$RSYNC_SSH" \
            --exclude='node_modules' --exclude='logs' --exclude='wallet-cache' --exclude='dist' \
            server/ "ec2-user@${EC2_HOST}:/opt/shadow-cipher/server/"

          # Contract package (runtime needs src/managed for ZK keys + package.json for workspace resolution)
          rsync -az --delete -e "$RSYNC_SSH" \
            --exclude='node_modules' \
            shadowcipher-contract/ "ec2-user@${EC2_HOST}:/opt/shadow-cipher/shadowcipher-contract/"

          # Root manifests for workspace install
          $SCP package.json package-lock.json turbo.json \
            "ec2-user@${EC2_HOST}:/opt/shadow-cipher/"

          # Install deps in workspace (ts-node is in devDependencies but we
          # run TypeScript directly at runtime, so install with dev deps),
          # then (re)start PM2. Use npm install (not ci) because deploy.yml
          # strips package-lock.json earlier in the build step.
          $SSH 'cd /opt/shadow-cipher && rm -f package-lock.json && npm install && (pm2 reload shadow-cipher-sponsor --update-env || pm2 start server/ecosystem.config.cjs) && pm2 save'

          # Ensure shared proof server is up (managed systemd unit, shared with guess-who)
          $SSH 'sudo systemctl is-active proof-server || sudo systemctl start proof-server'

          # Health check: pm2 must show the process online. We don't curl
          # /api/status here because the sponsor wallet SDK syncs dust on
          # startup, which can take several minutes before :3003 is bound.
          # Use `pm2 logs shadow-cipher-sponsor` after the deploy to watch
          # sync progress.
          $SSH 'sleep 5 && pm2 status shadow-cipher-sponsor | grep -E "online|launched" && pm2 logs shadow-cipher-sponsor --lines 15 --nostream || (pm2 logs shadow-cipher-sponsor --lines 60 --nostream; exit 1)'
